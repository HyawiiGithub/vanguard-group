name: refresh-ahd-snapshot

on:
  schedule:
    - cron: "3,33 * * * *" # every 30 minutes (game turns hourly)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/fetch-ahd.mjs
        env:
          AHD_API_KEY: ${{ secrets.AHD_API_KEY }}
      - name: commit snapshot
        run: |
          git config user.name "ahd-snapshot-bot"
          git config user.email "ahd-snapshot-bot@users.noreply.github.com"
          git add data/live.json
          git diff --cached --quiet && echo "no changes" || git commit -m "chore: refresh AHD snapshot $(date -u +%FT%TZ)"
          git push
